spring.application.name=StudentMarketPlace
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/student_marketplace}

# JWT config
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Static resources
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.chain.cache=false

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.example.studentmarketplace=INFO
