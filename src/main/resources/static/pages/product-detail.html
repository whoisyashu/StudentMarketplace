<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Student Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        .product-images {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .main-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #f0f0f0;
        }
        .thumbnail-images {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .thumbnail {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .thumbnail.active {
            border-color: #667eea;
        }
        .product-info {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .price-section {
            border-bottom: 2px solid #eee;
            padding-bottom: 1.5rem;
        }
        .price-tag {
            font-size: 2rem;
            color: #667eea;
            font-weight: bold;
        }
        .condition-badge {
            display: inline-block;
            background-color: #e0e0e0;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .seller-card {
            background-color: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .seller-name {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .seller-rating {
            color: #f39c12;
            margin-bottom: 0.5rem;
        }
        .seller-college {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .contact-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .contact-btn {
            padding: 1rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .contact-btn-message {
            background-color: #667eea;
            color: white;
        }
        .contact-btn-message:hover {
            background-color: #5568d3;
        }
        .contact-btn-call {
            background-color: #27ae60;
            color: white;
        }
        .contact-btn-call:hover {
            background-color: #229954;
        }
        .info-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #eee;
        }
        .info-label {
            color: #666;
            font-size: 0.9rem;
        }
        .info-value {
            font-weight: bold;
            color: #333;
            margin-top: 0.25rem;
        }
        .message-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo" onclick="location.href='/'">StudentMarketPlace</div>
            <ul class="nav-links">
                <li><a onclick="location.href='/'">Browse</a></li>
                <li><a onclick="location.href='/pages/products.html'">My Listings</a></li>
                <li><a onclick="location.href='/pages/chat.html'">Messages</a></li>
                <li><a onclick="location.href='/pages/profile.html'">Profile</a></li>
            </ul>
            <div class="auth-buttons"></div>
        </nav>
    </header>

    <div class="container">
        <button class="btn btn-secondary" onclick="history.back()" style="margin-bottom: 1.5rem;">Back</button>

        <div class="product-detail-container">
            <div class="product-images">
                <img id="mainImage" class="main-image" src="https://via.placeholder.com/400x400?text=Product+Image" alt="Product">
                <div class="thumbnail-images" id="thumbnails"></div>
            </div>

            <div class="product-info">
                <div>
                    <h2 id="productTitle">Product Title</h2>
                </div>

                <div class="price-section">
                    <div class="price-tag" id="productPrice">Rs 0.00</div>
                    <div class="condition-badge" id="condition">Condition</div>
                    <div id="negotiable" style="color: #27ae60; margin-top: 0.5rem; display: none;">Price negotiable</div>
                </div>

                <div class="info-item">
                    <div class="info-label">Category</div>
                    <div class="info-value" id="category">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">Location</div>
                    <div class="info-value" id="location">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">Posted</div>
                    <div class="info-value" id="createdAt">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">Views</div>
                    <div class="info-value" id="views">-</div>
                </div>

                <div class="info-item">
                    <div class="info-label">Description</div>
                    <div class="info-value" style="font-weight: normal; margin-top: 0.5rem;" id="description">-</div>
                </div>

                <div class="seller-card">
                    <div class="seller-name" id="sellerName">Seller Name</div>
                    <div class="seller-rating">
                        <span id="rating">★★★★★</span>
                        <span id="totalReviews">(0 reviews)</span>
                    </div>
                    <div class="seller-college" id="sellerCollege">College</div>

                    <div class="contact-section">
                        <button class="contact-btn contact-btn-message" onclick="openMessageModal()">Send Message</button>
                        <button class="contact-btn contact-btn-call" onclick="callSeller()">Call Seller</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="messageModal" class="message-modal">
            <div class="card" style="max-width: 400px; width: 90%;">
                <div class="card-header">Send Message to <span id="modalSellerName">Seller</span></div>
                <form id="messageForm">
                    <div class="form-group">
                        <label for="messageContent">Your Message</label>
                        <textarea id="messageContent" placeholder="I'm interested in this product..." required style="min-height: 100px;"></textarea>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" onclick="closeMessageModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        const productId = new URLSearchParams(window.location.search).get('id');
        let sellerData = {};

        function formatCurrency(value) {
            return `Rs ${Number(value || 0).toFixed(2)}`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!TokenManager.isAuthenticated()) {
                UI.redirectTo('/pages/login.html');
                return;
            }

            if (!productId) {
                UI.showAlert('Product not found', 'error');
                setTimeout(() => {
                    location.href = '/';
                }, 2000);
                return;
            }

            document.getElementById('messageForm').addEventListener('submit', submitMessage);
            await loadProduct();
        });

        async function loadProduct() {
            try {
                const product = await API.get(`/products/${productId}`);
                document.getElementById('productTitle').textContent = product.title;
                document.getElementById('productPrice').textContent = formatCurrency(product.price);
                document.getElementById('condition').textContent = product.condition.charAt(0).toUpperCase() + product.condition.slice(1);
                document.getElementById('category').textContent = product.category;
                document.getElementById('location').textContent = product.location;
                document.getElementById('description').textContent = product.description;
                document.getElementById('views').textContent = product.views;
                document.getElementById('createdAt').textContent = new Date(product.createdAt).toLocaleDateString();
                document.getElementById('negotiable').style.display = product.negotiable ? 'block' : 'none';

                const seller = await API.get(`/users/${product.sellerId}`);
                sellerData = seller;
                document.getElementById('sellerName').textContent = `${seller.firstName} ${seller.lastName}`;
                document.getElementById('sellerCollege').textContent = seller.college || 'College not provided';
                document.getElementById('modalSellerName').textContent = `${seller.firstName} ${seller.lastName}`;

                const rating = Math.round(seller.averageRating || 0);
                document.getElementById('rating').textContent = `${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}`;
                document.getElementById('totalReviews').textContent = `(${seller.totalReviews} reviews)`;

                const images = product.imageUrls?.length ? product.imageUrls : ['https://via.placeholder.com/400x400?text=No+Image'];
                document.getElementById('mainImage').src = images[0];
                document.getElementById('thumbnails').innerHTML = images.map((image, index) => `
                    <img class="thumbnail ${index === 0 ? 'active' : ''}" src="${image}" onclick="changeImage(this, '${image}')" alt="Thumbnail ${index + 1}">
                `).join('');
            } catch (error) {
                UI.showAlert(error.message || 'Failed to load product details', 'error');
                console.error(error);
            }
        }

        function changeImage(element, imageSrc) {
            document.getElementById('mainImage').src = imageSrc;
            document.querySelectorAll('.thumbnail').forEach((thumbnail) => thumbnail.classList.remove('active'));
            element.classList.add('active');
        }

        function openMessageModal() {
            document.getElementById('messageModal').style.display = 'flex';
            document.getElementById('messageContent').focus();
        }

        function closeMessageModal() {
            document.getElementById('messageModal').style.display = 'none';
            document.getElementById('messageForm').reset();
        }

        async function submitMessage(event) {
            event.preventDefault();

            try {
                await API.post('/messages/send', {
                    receiverId: sellerData.id,
                    content: document.getElementById('messageContent').value,
                    messageType: 'text',
                    productId
                });

                UI.showAlert('Message sent! Check your conversations.', 'success');
                closeMessageModal();
                setTimeout(() => {
                    location.href = '/pages/chat.html';
                }, 1500);
            } catch (error) {
                UI.showAlert(error.message || 'Failed to send message', 'error');
                console.error(error);
            }
        }

        function callSeller() {
            if (sellerData.contactNumber) {
                window.location.href = `tel:${sellerData.contactNumber}`;
                return;
            }

            UI.showAlert('Seller phone number not available', 'error');
        }
    </script>
</body>
</html>
